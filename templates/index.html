<html>
<head>
<title>subscription manager
</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<body>
    <div id="auth-screen" class="max-w-md mx-auto mt-20 px-4">
        <h1 class="text-center mb-6 text-4xl font-bold text-heading">Subscription App</h1>
        <div class="bg-white p-8 border border-default rounded-base shadow-xs">
            <h2 class="text-xl font-bold mb-4">Login or Register</h2>
            
            <label class="block mb-2 text-sm font-medium">Username</label>
            <input type="text" id="auth-username" class="w-full mb-4 px-3 py-2 border rounded-base" placeholder="Enter username">
            
            <label class="block mb-2 text-sm font-medium">Password</label>
            <input type="password" id="auth-password" class="w-full mb-6 px-3 py-2 border rounded-base" placeholder="Enter password">
            
            <div class="flex gap-4">
                <button onclick="loginUser()" class="w-full bg-blue-500 text-white px-4 py-2 rounded-base font-medium hover:bg-blue-600">Login</button>
                <button onclick="registerUser()" class="w-full bg-gray-200 text-gray-800 px-4 py-2 rounded-base font-medium hover:bg-gray-300">Register</button>
            </div>
            <p id="auth-message" class="text-red-500 text-center mt-4 text-sm font-bold"></p>
        </div>
    </div>

    <div id="dashboard-screen" class="hidden max-w-3xl mx-auto mt-10 px-4">
        
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-heading">My Subscriptions</h1>
            <button onclick="logoutUser()" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Logout</button>
        </div>

        <form id="sub-form" class="grid gap-6 mb-6 md:grid-cols-2">
            <div>
                <label for="Service_Name" class="block mb-2.5 text-sm font-medium text-heading">Service Name</label>
                <input type="text" id="Service_Name" class="border text-sm rounded-base block w-full px-3 py-2.5" placeholder="Netflix" required />
            </div>
            <div>
                <label for="Monthly_Cost" class="block mb-2.5 text-sm font-medium text-heading">Monthly Cost</label>
                <input type="number" step="0.01" id="Monthly_Cost" class="border text-sm rounded-base block w-full px-3 py-2.5" placeholder="12.88" required />
            </div>
            <div>
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add</button>
            </div>
        </form>

        <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border border-default">
            <table class="w-full text-sm text-left">
                <tr class="bg-neutral-primary border-b border-default">
                    <th class="px-4 py-2">Subscription</th>
                    <th class="px-4 py-2">Cost</th>
                    <th class="px-4 py-2">Action</th>
                </tr>
                <tbody id="sub-list">
                    </tbody>
            </table>
        </div>
        <h2 id="total-display" class="text-2xl font-bold mt-4 text-right">Total: $0.00</h2>
    </div>
	
	<script>
        // --- UI State Management ---
        const authScreen = document.getElementById('auth-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const authMessage = document.getElementById('auth-message');

        function showDashboard() {
            authScreen.classList.add('hidden');
            dashboardScreen.classList.remove('hidden');
            loadSubscriptions(); // Fetch data ONLY after showing the dashboard
        }

        function showAuth() {
            authScreen.classList.remove('hidden');
            dashboardScreen.classList.add('hidden');
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
        }

        // --- Authentication API Calls ---
        async function registerUser() {
            const user = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            
            if (res.ok) {
                authMessage.style.color = 'green';
                authMessage.innerText = "Success! You can now log in.";
            } else {
                authMessage.style.color = 'red';
                authMessage.innerText = data.error;
            }
        }

        async function loginUser() {
            const user = document.getElementById('auth-username').value;
            const pass = document.getElementById('auth-password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            
            if (res.ok) {
                authMessage.innerText = "";
                showDashboard(); // Logged in! Switch screens!
            } else {
                const data = await res.json();
                authMessage.style.color = 'red';
                authMessage.innerText = data.error;
            }
        }

        async function logoutUser() {
            await fetch('/api/logout', { method: 'POST' });
            showAuth(); // Switch back to login screen
        }

        // --- Your Existing CRUD Functions (Unchanged) ---
        const form = document.getElementById('sub-form');
        const tableBody = document.getElementById('sub-list');
        const totalDisplay = document.getElementById('total-display');
        let running_total = 0;

        async function loadSubscriptions() {
            try {
                const response = await fetch('/api/subscriptions');
                // If the bouncer rejects us during load, kick user to login screen
                if (response.status === 401) {
                    showAuth();
                    return;
                }
                
                const subscriptions = await response.json();
                tableBody.innerHTML = ""; 
                running_total = 0;

                subscriptions.forEach(sub => {
                    running_total += sub.cost;
                    const row = `
                        <tr class="bg-neutral-primary border-b border-default">
                            <td class="px-4 py-2">${sub.name}</td>
                            <td class="px-4 py-2">$${sub.cost.toFixed(2)}</td>
                            <td class="px-4 py-2">
                                <button onclick="deleteSub(${sub.id})" class="text-red-500 font-bold">X</button>
                            </td>
                        </tr>
                    `;
                    tableBody.insertAdjacentHTML('beforeend', row);
                });
                totalDisplay.innerText = "Total: $" + running_total.toFixed(2);
            } catch (error) { console.error("Error loading:", error); }
        }

        async function deleteSub(id) {
            await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            loadSubscriptions(); 
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const name = document.getElementById('Service_Name').value;
            const mcost = parseFloat(document.getElementById('Monthly_Cost').value);
            
            await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, cost: mcost })
            });

            loadSubscriptions();
            form.reset();
        });

        // Start by trying to load subscriptions. If it 401s, it will automatically show the login screen!
        loadSubscriptions();
    </script>
	
	
</body>
</html>
